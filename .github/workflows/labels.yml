---
# 🏷️ Velvet Chains — Label Codex Sync
name: "🏷️ Sync Corsair Labels"

on:
  workflow_dispatch: {}
  push:
    paths:
      - .github/labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: "📚 Harmonize Label Codex"
    runs-on: ubuntu-latest
    steps:
      - name: "📦 Hoist the Colors — Checkout"
        uses: actions/checkout@v7
      - name: "🏷️ Engrave the Corsair Label Codex"
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          skip-delete: true
